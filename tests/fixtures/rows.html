<!doctype html>
<html><head><meta charset="utf-8"><title>Rows</title></head>
<body>
  <template id="tpl"><li><span>Template</span> <button type="button">Delete</button></li></template>
  <div style="display:none"><button type="button">Delete</button></div>
  <ul>
    <li><span>Alpha</span> <button type="button" onclick="document.title='deleted Alpha'">Delete</button></li>
    <li><span>Bravo</span> <button type="button" onclick="document.title='deleted Bravo'">Delete</button></li>
    <li><span>Charlie</span> <button type="button" onclick="document.title='deleted Charlie'">Delete</button></li>
  </ul>
  <form onsubmit="event.preventDefault(); document.title='searched ' + document.getElementById('q').value">
    <label for="q">Search</label> <input id="q" name="q" type="text"> <button type="submit">Go</button>
  </form>
</body></html>
